server {
	listen 443 ssl;
	http2 on;
	server_name pilk.pijesper.me;

	access_log /var/log/nginx/pilk.log;
	error_log /var/log/nginx/pilk.e.log;

	ssl_certificate /etc/letsencrypt/live/pijesper.me/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pijesper.me/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/pijesper.me/fullchain.pem;
	client_max_body_size 128M;

	location / {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $server_name;
		proxy_pass http://localhost:8001; # to the pilk
	}

	location /_next/webpack-hmr {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $server_name;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_pass http://localhost:8001; # to the pilk
	}

}
